# =============================================================================
# 武汉教育赛事雷达 · Nginx 托管片段
#
# 站点：h5.eanavi.com（与 H5 测评站点共用同一个 server 块）
# 用法：把下面两个 location 原样插入站点配置文件的 server 块内，
#      位置放在 `location /` 之前。
#
# 静态壳本身不含内容——它在浏览器里 fetch https://admin.eanavi.com/api/content/radar
# 取已发布的期次数据。因此本目录只有一个 index.html，且内容改动无需重新部署。
# =============================================================================

# 裸路径 301。
# 缺了这条，`h5.eanavi.com/radar`（不带尾斜杠）会被 `location /` 的
# try_files 兜住并返回测评首页 index.html —— 不是 404，用户看起来就是「跳错页面了」。
location = /radar {
    return 301 /radar/;
}

location ^~ /radar/ {
    alias /srv/app/ai-navigation-pro/radar/;
    index index.html;

    # 同一个 URL 每周被覆盖，且微信内置浏览器缓存很重。
    # 不显式禁用缓存，用户会长期停留在上一期内容上。
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # ⚠️ nginx 的 add_header 不会继承：本 location 里一旦出现 add_header，
    # server 级的同名指令对本 location 全部失效。因此安全头必须在这里重新声明。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 只托管静态文件，任何可执行扩展名一律拒绝
    location ~* \.(php|jsp|asp|aspx|cgi|sh|py)$ {
        deny all;
    }
}
