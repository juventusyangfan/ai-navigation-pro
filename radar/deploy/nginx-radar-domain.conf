# =============================================================================
# 武汉教育赛事雷达 · 独立域名 radar.eanavi.com
#
# 与 nginx-radar.conf（h5.eanavi.com/radar/ 子路径）是**两套并行入口**，
# 互不干扰，旧链接与已推出去的文章不用改：
#   https://radar.eanavi.com/          ← 本文件（根路径直接是雷达首页）
#   https://h5.eanavi.com/radar/       ← nginx-radar.conf（保留）
#
# 雷达是纯静态目录（无 Node 进程），所以这里 root 直接指向仓库里的 radar/，
# `git pull` 后即刻生效，不需要 build、不需要 reload 应用。
#
# ── 若服务器上已经有 radar.eanavi.com 的 server 块 ────────────────────────
# 不必整块替换，只需核对两处：
#   1) root 指向 /srv/app/ai-navigation-pro/radar
#   2) 存在校验文件的精确 location（下文 80 与 443 各一份）
# 微信校验文件能否取到，只取决于这两条。
# =============================================================================

# ── 微信服务号「JS 接口安全域名」校验文件 ──────────────────────────────────
# 微信会以 HTTP 直接请求 /MP_verify_kyuZgM1EvgrBsubJ.txt，要求 200 + 内容逐字节一致。
# 两个硬要求：
#   a) 校验文件的 location 必须写在 `return 301` 之前 —— 否则请求被跳转到 https，
#      部分微信客户端不跟随跳转，校验直接失败。
#   b) 用 alias 精确指向文件，不依赖 root。root 日后被改动也不会连带失效。
# 内容为 16 字节、无 BOM 无换行，本仓库文件已逐字节核对。

server {
    listen 80;
    server_name radar.eanavi.com;

    # 校验文件：保持明文可达，不做 https 跳转
    location = /MP_verify_kyuZgM1EvgrBsubJ.txt {
        alias /srv/app/ai-navigation-pro/radar/MP_verify_kyuZgM1EvgrBsubJ.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }

    # Let's Encrypt 续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # nginx >= 1.25.1 用 http2 on；更低版本改成 `listen 443 ssl http2;`
    http2 on;
    server_name radar.eanavi.com;

    ssl_certificate     /etc/letsencrypt/live/radar.eanavi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.eanavi.com/privkey.pem;

    root /srv/app/ai-navigation-pro/radar;
    index index.html;

    # 首页、期次数据每周变化，微信内置浏览器缓存很重，不显式禁用会长期停在旧内容。
    # assets/ 下的样式同理：页面与样式必须同进同退，否则新旧混搭会错版。
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # ⚠️ nginx 的 add_header 不继承：本 server 内任何 location 一旦出现 add_header，
    # 上面这条与下面三条对这种 location 全部失效，必须在该 location 内重新声明。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 校验文件同样在 https 侧可达（微信个别环境走 https 校验）
    location = /MP_verify_kyuZgM1EvgrBsubJ.txt {
        alias /srv/app/ai-navigation-pro/radar/MP_verify_kyuZgM1EvgrBsubJ.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 只托管静态文件，任何可执行扩展名一律拒绝
    location ~* \.(php|jsp|asp|aspx|cgi|sh|py)$ {
        deny all;
    }
}
