# H5 听说测评（静态站点）- h5.eanavi.com
# 用法：sudo cp deploy/nginx-h5.conf /etc/nginx/sites-available/eanavi-h5
#      sudo ln -sf /etc/nginx/sites-available/eanavi-h5 /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 说明：本项目是纯静态 SPA（hash 路由），无需 Node 进程、无需 PM2，
#      Nginx 直接托管 dist 目录即可，与现有 front(:3000)/admin(:3001) 互不干扰。

server {
    listen 80;
    listen [::]:80;
    server_name h5.eanavi.com;

    # 申请证书前先注释本行（certbot 需要 HTTP 可达），证书配置完成后恢复
    # return 301 https://$host$request_uri;

    root /srv/app/ai-navigation-pro/H5/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name h5.eanavi.com;

    # SSL 证书（certbot --nginx 会自动填充，取消注释手动配置时使用）
    # ssl_certificate     /etc/letsencrypt/live/h5.eanavi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/h5.eanavi.com/privkey.pem;

    root /srv/app/ai-navigation-pro/H5/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的构建产物长期缓存；入口文件禁止缓存，避免发版后白屏
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
