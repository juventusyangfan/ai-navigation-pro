# H5 听说测评（静态站点）- h5.eanavi.com
# 用法：sudo cp deploy/nginx-h5.conf /etc/nginx/sites-available/eanavi-h5
#      sudo ln -sf /etc/nginx/sites-available/eanavi-h5 /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 说明：前端是纯静态 SPA（hash 路由），由 Nginx 直接托管 dist 目录；
#      但智聆口语评测需要在浏览器端拿到密钥，故另需运行密钥服务（server/index.mjs，
#      默认 :8787）并由 Nginx 反代 /api。密钥服务请用 pm2 / systemd 托管保活，
#      与现有 front(:3000)/admin(:3001) 互不干扰。

server {
    listen 80;
    listen [::]:80;
    server_name h5.eanavi.com;

    # 申请证书前先注释本行（certbot 需要 HTTP 可达），证书配置完成后恢复
    # return 301 https://$host$request_uri;

    root /srv/app/ai-navigation-pro/H5/dist;
    index index.html;

    # 赛事雷达（HTTP 侧同样需要，否则 http 访问 /radar/ 会返回测评首页）
    location = /radar {
        return 301 /radar/;
    }
    location ^~ /radar/ {
        alias /srv/app/ai-navigation-pro/radar/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name h5.eanavi.com;

    # SSL 证书（certbot --nginx 会自动填充，取消注释手动配置时使用）
    # ssl_certificate     /etc/letsencrypt/live/h5.eanavi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/h5.eanavi.com/privkey.pem;

    root /srv/app/ai-navigation-pro/H5/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的构建产物长期缓存；入口文件禁止缓存，避免发版后白屏
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端 Node 服务（server/index.mjs，默认 :8787）反代两项能力：
    #   1) 智聆凭证下发 /api/soe/credential（浏览器端拿临时密钥才能发起评测）
    #   2) 听力音频合成 /api/tts/audio（服务端调腾讯云 TTS，见 README 第八章）
    # 仅反代 /api，静态资源仍由 Nginx 直接托管。
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # [!] 不能是 10s：TTS 首次合成（含多段拼接）可能超过 10s，
        #     超时会导致前端拿到 504 而误判音频不可用。
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # 音频响应交给 Node 侧控制缓存头（immutable + ETag），Nginx 不额外缓存
        proxy_buffering on;
    }

    # ---- 赛事雷达（静态壳，内容运行时从 admin.eanavi.com 取）----
    # 裸路径 301：缺了这条，/radar 会被下方 location / 的 try_files 兜住，
    # 返回测评首页（不是 404，用户看起来就是跳错页面）。
    location = /radar {
        return 301 /radar/;
    }

    location ^~ /radar/ {
        alias /srv/app/ai-navigation-pro/radar/;
        index index.html;
        # 同一 URL 每周被覆盖，微信缓存重，必须禁用缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # ⚠️ add_header 不继承：本 location 内必须重新声明安全头，
        # 否则 server 级的三条对本 location 全部失效。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
