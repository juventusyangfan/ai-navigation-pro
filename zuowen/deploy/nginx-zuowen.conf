# 树蕙伴学 · 写作水平测评 —— nginx 站点
#
# 域名：zuowen.eanavi.com（首次部署需 DNS 解析 + certbot 签证书）
# 上游：Next.js 生产进程，127.0.0.1:3002
#
# 两处容易踩的点：
# 1. 正文是 data URL 提交的（一张压缩后的照片约 200-400KB，最多 3 张），
#    nginx 默认 client_max_body_size 只有 1M，不改会直接 413，
#    而前端只会看到「提交失败」，排查方向会被带偏。
# 2. 模型调用最长可能到 45 秒 ×2（识别 + 评测），
#    proxy_read_timeout 必须大于这个值，否则 nginx 先断开，
#    家长看到的是「网络不稳定」，服务端还在算，钱也花了。

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zuowen.eanavi.com;

    # 微信校验文件等需要明文可访问的路径放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zuowen.eanavi.com;

    ssl_certificate     /etc/letsencrypt/live/zuowen.eanavi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuowen.eanavi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 见文件头第 1 点
    client_max_body_size 12m;

    access_log /var/log/nginx/zuowen-access.log;
    error_log  /var/log/nginx/zuowen-error.log;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 见文件头第 2 点：两次模型调用最坏 90 秒，留够余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 报告页按 id 缓存没有意义（内容因人而异），关掉缓冲更利于首屏出字
        proxy_buffering off;
    }
}
